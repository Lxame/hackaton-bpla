version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: uav_db
    environment:
      - POSTGRES_USER=uav_user
      - POSTGRES_PASSWORD=strong_password
      - POSTGRES_DB=uav_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav_user -d uav_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: uav_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Для live-reload кода при разработке
    environment:
      - POSTGRES_USER=uav_user
      - POSTGRES_PASSWORD=strong_password
      - POSTGRES_DB=uav_analytics
      - DB_HOST=db # Указываем, что БД находится в сервисе 'db'
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД будет готова принимать подключения

volumes:
  postgres_data: